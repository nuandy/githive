<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<!-- Light or dark before the first paint, so no page flashes the wrong one (the same rule as lib/theme.ts). -->
		<script>
			try {
				const choice = localStorage.getItem("githive.theme");
				const dark = choice === "dark" || (choice !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
				document.documentElement.classList.toggle("dark", dark);
				if (choice === "light" || choice === "dark") document.documentElement.dataset.theme = choice;
			} catch {}
		</script>
		<title>GitHive</title>
		<link rel="preload" href="/fonts/overpass.woff2" as="font" type="font/woff2" crossorigin />
		<link
			rel="icon"
			href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><style>.t{fill:%231e2b33}.l{stroke:%23f5f6f4}@media (prefers-color-scheme:dark){.t{fill:%23f5f6f4}.l{stroke:%231e2b33}}</style><rect class='t' width='32' height='32' rx='7'/><path class='l' d='M10.2 6.5h11.6l5.8 9.5-5.8 9.5H10.2L4.4 16z' fill='none' stroke-width='2.6' stroke-linejoin='round'/><path class='l' d='M4.4 16H12' stroke-width='2.6' stroke-linecap='round'/><circle cx='16' cy='16' r='4' fill='%23e59a0b'/></svg>"
		/>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
